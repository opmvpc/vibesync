name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  qa-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Analyse statique
        run: |
          go vet ./...
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
      - name: Tests (unitaires + e2e simulés)
        run: go test ./...

  client-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain llvm-mingw
        shell: pwsh
        run: |
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/llvm-mingw-20260616-ucrt-x86_64.zip"
          Invoke-WebRequest $url -OutFile llvm.zip
          tar -xf llvm.zip -C C:\
          Rename-Item C:\llvm-mingw-20260616-ucrt-x86_64 C:\llvm-mingw
          echo "C:\llvm-mingw\bin" >> $env:GITHUB_PATH
      - name: Tests C (973+ vérifications, vecteurs golden inclus)
        shell: cmd
        working-directory: ui/win32
        run: build.bat test
      - name: Build release + budget taille (ADR-007/008)
        shell: pwsh
        working-directory: ui/win32
        run: |
          cmd /c build.bat
          $size = (Get-Item build\vibesync.exe).Length
          "vibesync.exe : $([math]::Round($size/1KB,1)) Ko"
          if ($size -gt 500KB) { throw "budget 500 Ko dépassé" }
      - uses: actions/upload-artifact@v4
        with:
          name: vibesync-windows
          path: ui/win32/build/vibesync.exe

  client-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Suite C portable (asan+ubsan, core/tests + 13 vecteurs)
        run: ./scripts/test-core-macos.sh
      - name: swift test (moteur Swift wrapper + API C, 45 tests)
        run: swift test
      - name: Build release + budget taille (ADR-007/008, < 10 Mo)
        run: |
          ./scripts/build-macos.sh
          size=$(du -sk ui/macos/build/VibeSync.app | cut -f1)
          echo "VibeSync.app : ${size} Ko"
          if [ "$size" -gt 10240 ]; then
            echo "budget 10 Mo dépassé" >&2
            exit 1
          fi
      # build-macos.sh signe déjà le bundle en ad hoc (codesign --force --sign -)
      # mais tolère un échec de signature. En CI on ne tolère rien : la .app
      # distribuée DOIT être signée, sinon Gatekeeper la refuse même après un
      # clic droit → Ouvrir. On vérifie donc au lieu de resigner.
      - name: Vérifier la signature ad hoc et l'architecture
        run: |
          codesign --verify --deep --strict --verbose=2 ui/macos/build/VibeSync.app
          codesign -dv ui/macos/build/VibeSync.app 2>&1 | grep -q "Signature=adhoc"
          archs=$(lipo -archs ui/macos/build/VibeSync.app/Contents/MacOS/VibeSync)
          echo "architecture : $archs"
          case " $archs " in
            *" arm64 "*) ;;
            *) echo "binaire non arm64 : $archs" >&2; exit 1 ;;
          esac
      # ditto (et pas zip) : seul lui préserve les attributs étendus, les droits
      # d'exécution et la signature d'un bundle .app à travers l'archive.
      - name: Archiver la .app pour la release (tags v* uniquement)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ditto -c -k --keepParent ui/macos/build/VibeSync.app VibeSync-macos-arm64.zip
          ls -l VibeSync-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: vibesync-macos
          path: VibeSync-macos-arm64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [qa-go, client-windows, client-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vibesync-windows
      - uses: actions/download-artifact@v4
        with:
          name: vibesync-macos
      # Un seul job crée la release et y attache les deux clients : pas de
      # course entre deux jobs sur la même release. Le `gh release view` rend
      # l'étape rejouable (re-run d'un tag déjà publié : on remplace les
      # fichiers au lieu d'échouer sur « release already exists »).
      - name: Créer la release et attacher les clients
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          files="vibesync.exe VibeSync-macos-arm64.zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # shellcheck disable=SC2086
            gh release upload "$GITHUB_REF_NAME" --clobber $files
          else
            # shellcheck disable=SC2086
            gh release create "$GITHUB_REF_NAME" --generate-notes \
              --title "vibesync $GITHUB_REF_NAME" $files
          fi

# Le serveur est construit par Coolify depuis le Dockerfile du repo.
# Les deux clients sont publiés sur la même release GitHub (tags v*) :
# vibesync.exe (Windows, non signé) et VibeSync-macos-arm64.zip (macOS Apple
# Silicon, signature ad hoc, sans notarisation — les amis passent par
# clic droit → Ouvrir la première fois, cf. docs/guide-amis-macos.md).
