name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  qa-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Analyse statique
        run: |
          go vet ./...
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
      - name: Tests (unitaires + e2e simulés)
        run: go test ./...

  client-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain llvm-mingw
        shell: pwsh
        run: |
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/llvm-mingw-20260616-ucrt-x86_64.zip"
          Invoke-WebRequest $url -OutFile llvm.zip
          tar -xf llvm.zip -C C:\
          Rename-Item C:\llvm-mingw-20260616-ucrt-x86_64 C:\llvm-mingw
          echo "C:\llvm-mingw\bin" >> $env:GITHUB_PATH
      - name: Tests C (973+ vérifications, vecteurs golden inclus)
        shell: cmd
        working-directory: ui/win32
        run: build.bat test
      - name: Build release + budget taille (ADR-007/008)
        shell: pwsh
        working-directory: ui/win32
        run: |
          cmd /c build.bat
          $size = (Get-Item build\vibesync.exe).Length
          "vibesync.exe : $([math]::Round($size/1KB,1)) Ko"
          if ($size -gt 500KB) { throw "budget 500 Ko dépassé" }
      - uses: actions/upload-artifact@v4
        with:
          name: vibesync-windows
          path: ui/win32/build/vibesync.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [qa-go, client-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vibesync-windows
      - name: Créer la release et attacher l'exe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            --title "vibesync $GITHUB_REF_NAME" vibesync.exe

# Le serveur est construit par Coolify depuis le Dockerfile du repo.
# Le client macOS (ui/macos) sera buildé sur le Mac (voir docs/build-macos.md) ;
# un job macos-latest pourra être ajouté quand le build y sera reproductible.
